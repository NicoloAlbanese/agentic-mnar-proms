[project]
name = "agentic-mnar-proms"
version = "0.1.0"
description = "Agentic framework for MNAR sensitivity analysis on PROMs data"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.12.0",
    "statsmodels>=0.14.0",
    "strands-agents>=0.1.0",
    "strands-agents-tools>=0.1.0",
    "boto3>=1.35.0",
    "scikit-learn>=1.4.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "tqdm>=4.66.0",
    "pyyaml>=6.0.0",
    "pyarrow>=24.0.0",
]
